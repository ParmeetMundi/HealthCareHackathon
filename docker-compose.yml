# ── CrewAI Healthcare Orchestrator — Docker Compose (local dev) ─────────────────
#
# Runs the single orchestrator service that hosts all agents in-process
# via CrewAI's hierarchical crew.
#
# Usage:
#   docker compose up --build    # First time: build the image and start
#   docker compose up            # Subsequent runs (image already built)
#   docker compose down          # Stop
#
# Prerequisites:
#   Copy .env.example to .env and set your API key(s) before running.

services:

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: healthcare
      POSTGRES_PASSWORD: healthcare
      POSTGRES_DB: healthcare
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcare"]
      interval: 5s
      timeout: 5s
      retries: 5

  orchestrator:
    build: .
    env_file: .env
    environment:
      AGENT_MODULE: orchestrator.app:a2a_app
      PORT: "8003"
      DATABASE_URL: postgresql://healthcare:healthcare@postgres:5432/healthcare
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
