patient_records_task:
  description: >
    QUESTION: {question}

    STEP 1 — Classify which data categories are needed:
    - Allergies question → call Get Allergies only
    - Demographics question → call Get Patient Demographics only
    - Medications question → call Get Active Medications only
    - Conditions question → call Get Active Conditions only
    - Care team question → call Get Care Team only
    - Broad question ("what is wrong", "full review") → call ALL categories

    STEP 2 — Call ONLY the identified tools. Accept each result as-is.
    STEP 3 — Format results with clear labels and exact FHIR values.
    STEP 4 — Return Final Answer immediately.

    If any tool returns count=0 or error, report it and continue.
    Do NOT retry failed queries. Do NOT call unneeded tools.
  expected_output: >
    A focused data summary containing ONLY the categories relevant
    to the question. Each section clearly labelled with exact values
    and dates from FHIR. No unrelated sections.
  agent: patient_records_agent

clinical_notes_task:
  description: >
    QUESTION: {question}

    Execute exactly 2 tool calls, then return Final Answer:
    1. Call "Get Document References" → summarise decoded_text content.
    2. Call "Get Diagnostic Reports" → summarise report conclusions.

    If either returns count=0, note "No [resource] available" and
    continue. After BOTH calls, compose a summary of findings relevant
    to the question and return Final Answer. Do NOT re-query.
  expected_output: >
    A concise summary of clinical document findings relevant to the
    question. If no documents exist, state that clearly. No fixed
    template — shape the answer to match the question.
  agent: clinical_notes_agent
  context:
    - patient_records_task

radiology_task:
  description: >
    QUESTION: {question}

    Execute exactly 2 tool calls, then return Final Answer:
    1. Call "Get Imaging Studies" → extract modality, date, body site.
    2. Call "Get Radiology Reports" → extract findings, impression,
       recommendations.

    If BOTH return count=0, return Final Answer: "No imaging studies
    or radiology reports are available for this patient." STOP.
    Do NOT make additional tool calls after confirming no data.
  expected_output: >
    If studies exist: modality, date, findings, impression relevant
    to the question. If NO studies exist: "No imaging studies or
    radiology reports are available for this patient." Nothing else.
  agent: radiology_agent
  context:
    - patient_records_task

pharmacy_review_task:
  description: >
    QUESTION: {question}

    STEP 1 — Check context: If patient_records_task already has the
    medication list, use it. Do NOT call Get Active Medications again.
    STEP 2 — If no meds in context, call "Get Active Medications" ONCE.
    STEP 3 — If count=0, return Final Answer: "No active medications —
    no drug interaction or dosage review applicable." STOP.
    STEP 4 — If medications exist, call "Check Drug Interactions" for
    relevant pairs and "Get Medication Info" for dosage verification.
    STEP 5 — Return Final Answer with interaction findings and
    dosage assessment.

    Do NOT re-query. Do NOT delegate. Maximum 4 tool calls total.
  expected_output: >
    Medication safety findings relevant to the question: active meds,
    interactions (with severity), dosage concerns. If no meds, state
    that clearly and stop.
  agent: pharmacist_agent
  context:
    - patient_records_task

lab_diagnostics_task:
  description: >
    QUESTION: {question}

    Execute exactly 2 tool calls, then return Final Answer:
    1. Call "Get Lab Results" → extract values with units and ranges.
    2. Call "Get Recent Observations" → extract vitals.

    For each result: flag abnormal values, note trends if multiple
    readings exist (↑/→/↓), correlate with known conditions from context.

    If BOTH return count=0, return Final Answer: "No laboratory results
    or vital signs available for this patient." STOP.
    Do NOT re-query. Maximum 2 tool calls.
  expected_output: >
    Lab/vitals summary relevant to the question. Flag abnormal values
    with reference ranges. Note trends. If no data, state clearly
    and stop.
  agent: lab_diagnostics_agent
  context:
    - patient_records_task

surgical_planning_task:
  description: >
    QUESTION: {question}

    ALL clinical data is in your CONTEXT from prior tasks. Do NOT
    re-query FHIR for conditions, medications, labs, or allergies.

    STEP 1 — Read context: Extract conditions, medications, lab values,
    allergies from prior task outputs.
    STEP 2 — If procedure history is needed and not in context, call
    "Get Procedure History" ONCE. Otherwise ZERO tool calls.
    STEP 3 — Assess: ASA classification, surgical risk factors,
    perioperative medication management, monitoring needs.
    STEP 4 — Return Final Answer.

    EARLY EXIT: If context shows no significant conditions, no
    medications, and no labs, return brief ASA I assessment with
    recommendation for baseline labs. STOP.
  expected_output: >
    Surgical risk assessment relevant to the question: ASA class,
    risk factors, perioperative plan. If insufficient data, note
    gaps and recommend baseline workup. Brief and focused.
  agent: surgical_planning_agent
  context:
    - patient_records_task
    - lab_diagnostics_task
    - pharmacy_review_task

mdt_synthesis_task:
  description: >
    QUESTION: {question}

    ZERO TOOL CALLS. All data is in your context from prior tasks.

    Read every specialist task output, then write the MDT brief with
    these sections:
    1. Patient Background — demographics, presenting complaint, history
    2. Radiology Findings — imaging studies, key findings
    3. Lab Summary — abnormal results, trends, significance
    4. Medication Review — current meds, interactions, safety concerns
    5. Surgical Considerations — risk factors, perioperative plan
    6. Outstanding Questions — data gaps, pending investigations
    7. MDT Recommendations — actionable next steps with rationale

    For sections with no data in context, write "No data available."
    Cross-reference findings across specialties. Return Final Answer
    in a SINGLE pass.
  expected_output: >
    A complete MDT brief with all seven sections. Each section
    populated from specialist context or marked "No data available."
    Recommendations must be actionable with clear next steps.
  agent: mdt_coordination_agent
  context:
    - patient_records_task
    - clinical_notes_task
    - radiology_task
    - pharmacy_review_task
    - lab_diagnostics_task
    - surgical_planning_task

general_purpose_task:
  description: >
    QUESTION: {question}

    This is a general healthcare request that does not fall under any
    specialist domain (not radiology, pharmacy, lab, surgical, or clinical
    notes). Examples include nutrition plans, exercise plans, lifestyle
    advice, wellness recommendations, and patient education.

    STEP 1 — CHECK CONTEXT: Read patient data from prior task outputs
    (conditions, medications, allergies, demographics).
    STEP 2 — FETCH IF NEEDED: If relevant patient data is missing from
    context, call the appropriate FHIR tools to retrieve it. Focus on
    conditions, medications, allergies, and demographics.
    STEP 3 — PERSONALISE OR GENERALISE:
    - If patient data is available: tailor your response to the patient's
      specific conditions, medications, allergies, and demographics.
    - If patient data is NOT available or all categories are empty:
      provide a GENERIC but comprehensive response. For example, if a
      nutritional plan is requested, provide a full general nutritional
      plan covering balanced meals, macronutrients, hydration, vitamins,
      and healthy eating habits. NEVER just say "no data available" and
      stop — always give the user actionable content.
    STEP 4 — RESPOND: Provide a comprehensive, structured, actionable
    response with clear sections and practical recommendations.

    RULES:
    - If patient data exists, personalise to it.
    - If no patient data exists, provide a well-structured generic plan
      and note it is general guidance.
    - Flag recommendations that require specialist review.
    - Include appropriate clinical disclaimers.
    - Do NOT re-query data already in context.
    - Maximum 5 tool calls.
    - NEVER return an empty or data-unavailable-only response.
  expected_output: >
    A comprehensive response to the patient's request — personalised
    if patient data is available, or a well-structured generic plan
    if not. Must include clear sections, practical recommendations,
    and any relevant warnings or disclaimers. NEVER be empty or just
    state that data is unavailable without providing actionable content.
  agent: general_purpose_agent
  context:
    - patient_records_task
